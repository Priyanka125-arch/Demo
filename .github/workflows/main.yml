name: Demo CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Build Docker Image
        run: |
          docker build -t demo-app:latest .

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-app:latest
          scan-type: image
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true

      - name: Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-app:latest
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pandas openpyxl

      - name: Convert SBOM to Excel
        run: |
          python convert_sbom.py

      - name: Upload SBOM Excel
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-sbom
          path: sbom.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Create Reports Directory
        run: |
          mkdir -p reports

      - name: Run OWASP Dependency Check
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            -v ${{ github.workspace }}/reports:/report \
            owasp/dependency-check:12.1.8 \
            --scan /src \
            --format HTML \
            --out /report

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

      - name: Notify Teams
        if: always()
        run: |
          cat > payload.json << EOF
          {
            "text": "Repository: ${{ github.repository }}\nWorkflow: ${{ github.workflow }}\nStatus: ${{ job.status }}\nBranch: ${{ github.ref_name }}"
          }
          EOF

          curl -H "Content-Type: application/json" \
            -d @payload.json \
            "${{ secrets.Testing }}"

      - name: Finish Pipeline
        run: |
          echo "Pipeline completed successfully"
