name: Demo CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t demo-app:latest .

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-app:latest
          scan-type: image
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true

      - name: Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-app:latest
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Create SBOM Excel Report
        run: |
          cat > convert_sbom.py << 'PYTHON'
          import json
          import pandas as pd

          with open("sbom.cdx.json", "r") as f:
              sbom = json.load(f)

          components = sbom.get("components", [])

          rows = []
          for comp in components:
              rows.append({
                  "Name": comp.get("name", ""),
                  "Version": comp.get("version", ""),
                  "Type": comp.get("type", ""),
                  "Publisher": comp.get("publisher", ""),
                  "Group": comp.get("group", ""),
                  "PURL": comp.get("purl", "")
              })

          if not rows:
              rows.append({
                  "Name": "No components found",
                  "Version": "",
                  "Type": "",
                  "Publisher": "",
                  "Group": "",
                  "PURL": ""
              })

          df = pd.DataFrame(rows)
          df.to_excel("sbom.xlsx", index=False)

          print("SBOM Excel report created successfully.")
          PYTHON

          python convert_sbom.py

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-sbom
          path: |
            sbom.cdx.json
            sbom.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Finish Pipeline
        run: echo "Pipeline completed successfully"
