name: Demo CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Build Docker Image
        run: |
          docker build -t demo-app:latest .

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          image-ref: demo-app:latest
          scan-type: image
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true

      - name: Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        with:
          image-ref: demo-app:latest
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pandas openpyxl

      - name: Convert SBOM to Excel
        run: |
          python convert_sbom.py

      - name: Upload SBOM Excel
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-sbom
          path: sbom.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Create Reports Directory
        run: |
          mkdir -p reports

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

      - name: Notify Teams
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TESTING }}
        run: |
          cat > payload.json << 'EOF'
          {
            "type": "AdaptiveCard",
            "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
            "version": "1.4",
            "body": [
              {
                "type": "TextBlock",
                "size": "Large",
                "weight": "Bolder",
                "text": "GitHub Actions Notification"
              },
              {
                "type": "TextBlock",
                "text": "Repository: ${{ github.repository }}"
              },
              {
                "type": "TextBlock",
                "text": "Workflow: ${{ github.workflow }}"
              },
              {
                "type": "TextBlock",
                "text": "Branch: ${{ github.ref_name }}"
              },
              {
                "type": "TextBlock",
                "text": "Status: ${{ job.status }}"
              },
              {
                "type": "TextBlock",
                "text": "Run Number: ${{ github.run_number }}"
              },
              {
                "type": "TextBlock",
                "wrap": true,
                "text": "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              }
            ]
          }
          EOF

          echo "=== Payload ==="
          cat payload.json

          curl -i -v \
            -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$TEAMS_WEBHOOK_URL"

      - name: Finish Pipeline
        run: |
          echo "Pipeline completed successfully"
